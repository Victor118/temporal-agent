{{define "title"}}Connexion{{end}}
{{define "content"}}{{end}}

{{define "login"}}<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion · Admin</title>
<link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
<main class="login">
  <h1>Configuration</h1>
  {{with .Data}}
  <p class="lead">Réservé aux comptes administrateurs.</p>
  {{with .Error}}<div class="error">{{.}}</div>{{end}}
  <form method="post" action="/admin/login">
    <input type="hidden" name="next" value="{{.Next}}">
    <input type="email" name="email" value="{{.Email}}" placeholder="Email" autocomplete="username" required {{if not .Email}}autofocus{{end}}>
    <input type="password" name="password" placeholder="Mot de passe" autocomplete="current-password" required {{if .Email}}autofocus{{end}}>
    <button class="primary" type="submit">Se connecter</button>
  </form>
  {{end}}
  <p class="note"><a class="link" href="/">← Retour au chat</a></p>
</main>
</body>
</html>
{{end}}
