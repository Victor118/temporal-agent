<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporal Agent</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <script src="https://unpkg.com/marked@15.0.4/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 12px 20px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 16px; font-weight: 600; color: #fff; }
        #session-info { font-size: 12px; color: #666; }
        #header-right { display: flex; align-items: center; gap: 12px; }

        .session-entry {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .session-entry:hover { border-color: #444; }
        .session-entry.active { border-color: #22c55e; }
        .session-entry .session-title { color: #e0e0e0; font-size: 14px; }
        .session-entry .session-meta { font-size: 12px; color: #666; }
        .session-entry .status-dot {
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        }
        .session-entry .status-dot.active { background: #22c55e; }
        .session-entry .status-dot.inactive { background: #666; }
        .session-entry .session-right { display: flex; align-items: center; gap: 8px; }
        .session-delete {
            background: none;
            border: none;
            color: #666;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            line-height: 1;
            opacity: 0;
        }
        .session-entry:hover .session-delete { opacity: 1; }
        .session-delete:hover { color: #ef4444; background: #2a2a2a; }
        .message {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            line-height: 1.6;
        }
        .message.user {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 12px 16px;
            align-self: flex-end;
        }
        .message.assistant {
            padding: 4px 0;
        }
        .message.assistant pre {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .message.assistant code {
            font-size: 13px;
            background: #2a2a2a;
            padding: 2px 5px;
            border-radius: 3px;
        }
        .message.assistant ul, .message.assistant ol {
            margin: 8px 0;
            padding-left: 24px;
        }
        .message.assistant li { margin: 4px 0; }
        .message.assistant h1, .message.assistant h2, .message.assistant h3 {
            margin: 12px 0 6px;
            color: #fff;
        }
        .message.assistant p { margin: 6px 0; }
        .message.assistant strong { color: #fff; }
        .message.assistant a { color: #3b82f6; text-decoration: none; }
        .message.assistant a:hover { text-decoration: underline; }
        .tool-call {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            background: #1a1a1a;
            border-left: 3px solid #f59e0b;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 13px;
            color: #999;
        }
        .tool-call .tool-name { color: #f59e0b; font-weight: 600; }

        .ask-user {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            background: #1a1a2e;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 12px 16px;
        }
        .ask-user .agent-chain {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #666;
            margin-bottom: 8px;
        }
        .ask-user .agent-chain .agent-name {
            background: #2a2a3e;
            border-radius: 4px;
            padding: 2px 6px;
            color: #8b8baf;
        }
        .ask-user .agent-chain .separator {
            color: #444;
        }
        .ask-user .question {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 10px;
        }
        .ask-user-form {
            display: flex;
            gap: 8px;
        }
        .ask-user-form input {
            flex: 1;
            background: #0f0f1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #e0e0e0;
            padding: 8px 12px;
            font-size: 13px;
            font-family: inherit;
        }
        .ask-user-form input:focus { outline: none; border-color: #3b82f6; }
        .ask-user-form button {
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .ask-user-form button:hover { background: #2563eb; }
        .ask-user.answered { opacity: 0.5; border-color: #333; }
        .ask-user.answered .ask-user-form { display: none; }
        .ask-user .answered-text {
            font-size: 12px;
            color: #666;
            font-style: italic;
        }

        #input-area {
            border-top: 1px solid #2a2a2a;
            padding: 16px 20px;
        }
        #input-form {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            gap: 8px;
        }
        #input-form textarea {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            rows: 1;
            min-height: 42px;
            max-height: 120px;
        }
        #input-form textarea:focus { outline: none; border-color: #555; }
        #input-form button {
            background: #e0e0e0;
            color: #0f0f0f;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        #input-form button:hover { background: #fff; }
        #input-form button:disabled { opacity: 0.4; cursor: not-allowed; }
        #input-form button.stop-btn { background: #ef4444; color: #fff; }
        #input-form button.stop-btn:hover { background: #dc2626; }

        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline; }

        #status {
            text-align: center;
            padding: 4px;
            font-size: 12px;
            color: #666;
        }

        /* Notifications */
        .notification-bell {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            position: relative;
            padding: 4px 8px;
            line-height: 1;
        }
        .notification-badge {
            position: absolute;
            top: -2px;
            right: 0;
            background: #ef4444;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        .notification-panel {
            position: absolute;
            top: 36px;
            right: 0;
            width: 360px;
            max-height: 420px;
            overflow-y: auto;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            z-index: 100;
        }
        .notification-panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .notification-clear-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 11px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .notification-clear-btn:hover { color: #ef4444; background: #2a2a2a; }
        .notification-item {
            padding: 12px 16px;
            border-bottom: 1px solid #1f1f1f;
            font-size: 13px;
            line-height: 1.5;
            color: #ccc;
            position: relative;
        }
        .notification-item:hover .notification-dismiss { opacity: 1; }
        .notification-dismiss {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            opacity: 0;
            padding: 2px 6px;
            border-radius: 4px;
            line-height: 1;
        }
        .notification-dismiss:hover { color: #ef4444; background: #2a2a2a; }
        .notification-item:last-child { border-bottom: none; }
        .notification-item p { margin: 4px 0; }
        .notification-item a { color: #3b82f6; }
        .notification-empty {
            padding: 32px 16px;
            text-align: center;
            color: #666;
            font-size: 13px;
        }
        #members-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 20px; border-bottom:1px solid #2a2a2a; font-size:12px; color:#888; }
        #members-bar input { background:#1a1a1a; border:1px solid #333; border-radius:6px; color:#e0e0e0; padding:4px 8px; font-size:12px; font-family:inherit; width:200px; }
        #members-bar button { background:#2a2a2a; color:#e0e0e0; border:none; border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer; }
        #members-bar #leave-btn { margin-left:auto; background:none; color:#888; }
        #members-error { color:#ef4444; }
        .member-chip { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:10px; padding:2px 8px; color:#e0e0e0; }
        .message .author { display:block; font-size:11px; color:#888; margin-bottom:2px; }
        .message.user.other { background:#1a2a1e; align-self:flex-start; }
        .message { position:relative; }
        .fork-btn { position:absolute; top:4px; right:4px; opacity:0; background:#2a2a2a; color:#aaa; border:none; border-radius:6px; padding:2px 8px; font-size:11px; cursor:pointer; }
        .message:hover .fork-btn { opacity:1; }
        .fork-btn:hover { color:#fff; }
        .message.highlight { outline:2px solid #a78bfa; outline-offset:4px; border-radius:8px; }
        .fork-banner { max-width:720px; width:100%; margin:0 auto; font-size:12px; color:#888; }
        .fork-banner a, .fork-marker a { color:#a78bfa; }
        .fork-marker { max-width:720px; width:100%; margin:-8px auto 0; font-size:11px; color:#888; }
        .fork-summary { max-width:720px; width:100%; margin:0 auto; background:#16161f; border:1px solid #2a2a3a; border-radius:10px; padding:10px 14px; font-size:13px; }
        .fork-summary summary { cursor:pointer; color:#a78bfa; }
        .fork-summary-body { margin-top:8px; line-height:1.5; }
        .fork-summary-body ul, .fork-summary-body ol { padding-left:20px; margin:4px 0; }
        .fork-summary-body p { margin:6px 0; }
    </style>
</head>
<body>
    <header>
        <h1>Temporal Agent</h1>
        <div id="header-right">
            <span id="session-info"></span>
            <div id="notification-container" style="position:relative;display:none;">
                <button class="notification-bell" onclick="toggleNotificationPanel()">
                    🔔
                    <span id="notification-badge" class="notification-badge" style="display:none;">0</span>
                </button>
                <div id="notification-panel" class="notification-panel" style="display:none;">
                    <div class="notification-panel-header">
                        <span>Notifications</span>
                        <button class="notification-clear-btn" onclick="clearAllNotifications(event)">Clear all</button>
                    </div>
                    <div id="notification-list"></div>
                </div>
            </div>
            <a id="btn-config" href="/admin/" style="display:none;background:#2a2a2a;color:#e0e0e0;border-radius:6px;padding:6px 12px;font-size:12px;text-decoration:none;">Configuration</a>
            <button id="btn-admin" onclick="showScreen('admin')" style="display:none;background:#2a2a2a;color:#e0e0e0;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;">Admin</button>
            <button id="btn-back" onclick="showSessionList()" style="display:none;background:#2a2a2a;color:#e0e0e0;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;">Sessions</button>
            <span id="user-info" style="font-size:12px;color:#666;"></span>
            <button id="btn-logout" onclick="logout()" style="display:none;background:none;color:#888;border:none;font-size:12px;cursor:pointer;">Log out</button>
        </div>
    </header>

    <!-- Login screen -->
    <div id="login-screen" style="display:none;">
        <div style="max-width:360px;margin:120px auto;text-align:center;">
            <h2 style="color:#fff;margin-bottom:24px;">Welcome</h2>
            <form id="login-form" style="display:flex;flex-direction:column;gap:8px;">
                <input id="email-input" type="email" placeholder="Email" autocomplete="username" autofocus required
                       style="background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#e0e0e0;padding:10px 14px;font-size:14px;font-family:inherit;" />
                <input id="password-input" type="password" placeholder="Password" autocomplete="current-password" required
                       style="background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#e0e0e0;padding:10px 14px;font-size:14px;font-family:inherit;" />
                <div id="login-error" style="color:#ef4444;font-size:12px;display:none;"></div>
                <button type="submit" style="background:#e0e0e0;color:#0f0f0f;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;">Log in</button>
            </form>
        </div>
    </div>

    <!-- Session list -->
    <div id="session-list-screen" style="display:none;">
        <div style="max-width:720px;margin:40px auto;padding:0 20px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h2 style="color:#fff;font-size:18px;">Your sessions</h2>
                <button onclick="createNewSession()" style="background:#e0e0e0;color:#0f0f0f;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;">New session</button>
            </div>
            <div id="session-entries"></div>
        </div>
    </div>

    <!-- Admin screen -->
    <div id="admin-screen" style="display:none;">
        <div style="max-width:720px;margin:40px auto;padding:0 20px;">
            <h2 style="color:#fff;font-size:18px;margin-bottom:20px;">Activity Queue Routing</h2>
            <p style="color:#888;font-size:13px;margin-bottom:20px;">Assign activities to specific task queues. Unassigned activities run on the workflow's own queue.</p>

            <div id="aq-list" style="margin-bottom:24px;"></div>

            <div style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:16px;">
                <h3 style="color:#fff;font-size:14px;margin-bottom:12px;">Add mapping</h3>
                <form id="aq-form" style="display:flex;gap:8px;align-items:flex-end;">
                    <div style="flex:1;">
                        <label style="font-size:12px;color:#888;display:block;margin-bottom:4px;">Activity</label>
                        <select id="aq-activity" style="width:100%;background:#0f0f0f;border:1px solid #333;border-radius:6px;color:#e0e0e0;padding:8px 10px;font-size:13px;font-family:inherit;">
                            <option value="CallLLM">CallLLM</option>
                            <option value="ExecuteTool">ExecuteTool</option>
                            <option value="LoadSkillsForQueue">LoadSkillsForQueue</option>
                            <option value="NotifyStep">NotifyStep</option>
                            <option value="LoadContext">LoadContext</option>
                            <option value="PersistContext">PersistContext</option>
                        </select>
                    </div>
                    <div style="flex:1;">
                        <label style="font-size:12px;color:#888;display:block;margin-bottom:4px;">Task Queue</label>
                        <select id="aq-queue" style="width:100%;background:#0f0f0f;border:1px solid #333;border-radius:6px;color:#e0e0e0;padding:8px 10px;font-size:13px;font-family:inherit;">
                        </select>
                    </div>
                    <button type="submit" style="background:#e0e0e0;color:#0f0f0f;border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;">Save</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Chat screen -->
    <div id="chat-screen" style="display:none;flex:1;display:flex;flex-direction:column;overflow:hidden;">
        <div id="members-bar">
            <span id="members-list"></span>
            <form id="add-member-form" style="display:inline-flex;gap:6px;">
                <input id="add-member-input" type="email" placeholder="Add a member by email" />
                <button type="submit">Add</button>
            </form>
            <span id="members-error"></span>
            <button id="leave-btn" onclick="leaveSession()">Leave</button>
        </div>
        <div id="chat" style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;"></div>
        <div id="status"></div>
        <div id="input-area">
            <form id="input-form">
                <textarea id="message-input" placeholder="Send a message..." rows="1"
                          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit()}"></textarea>
                <button type="submit">Send</button>
            </form>
        </div>
    </div>

    <script>
        marked.setOptions({ breaks: true });
        let currentUser = null;
        let sessionID = null;
        let evtSource = null;
        let notifSource = null;
        let notifications = [];
        let unreadCount = 0;
        let isProcessing = false;

        function setProcessing(active) {
            isProcessing = active;
            const btn = document.querySelector('#input-form button');
            if (active) {
                btn.textContent = 'Stop';
                btn.classList.add('stop-btn');
            } else {
                btn.textContent = 'Send';
                btn.classList.remove('stop-btn');
            }
        }

        // --- Screen management ---
        function showScreen(name) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('session-list-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('admin-screen').style.display = 'none';
            document.getElementById('btn-back').style.display = 'none';
            document.getElementById('btn-admin').style.display = 'none';
            document.getElementById('session-info').textContent = '';

            if (name === 'login') {
                document.getElementById('login-screen').style.display = 'block';
            } else if (name === 'sessions') {
                document.getElementById('session-list-screen').style.display = 'block';
                if (isAdmin()) document.getElementById('btn-admin').style.display = 'inline-block';
                loadSessionList();
            } else if (name === 'chat') {
                document.getElementById('chat-screen').style.display = 'flex';
                document.getElementById('btn-back').style.display = 'inline-block';
                document.getElementById('session-info').textContent = sessionID.slice(0, 8) + '...';
                loadMembers();
            } else if (name === 'admin') {
                document.getElementById('admin-screen').style.display = 'block';
                document.getElementById('btn-back').style.display = 'inline-block';
                loadAdminData();
            }
        }

        function isAdmin() { return currentUser && currentUser.role === 'admin'; }
        function userName(u) { return u.display_name || u.email; }

        // Every API call goes through here: a 401 means the login session is
        // gone (expired, logged out elsewhere, account disabled).
        async function api(url, options) {
            const resp = await fetch(url, options);
            if (resp.status === 401) {
                showLoggedOut();
                throw new Error('logged out');
            }
            return resp;
        }

        function jsonBody(method, body) {
            return { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
        }

        // --- Init ---
        async function init() {
            const resp = await fetch('/auth/me');
            if (resp.ok) {
                setUser(await resp.json());
            } else {
                showScreen('login');
            }
        }

        function setUser(user) {
            currentUser = user;
            document.getElementById('user-info').textContent = userName(user);
            document.getElementById('btn-logout').style.display = 'inline-block';
            document.getElementById('btn-config').style.display = isAdmin() ? 'inline-block' : 'none';
            connectNotifications();
            showScreen('sessions');
        }

        function showLoggedOut() {
            currentUser = null;
            if (evtSource) { evtSource.close(); evtSource = null; }
            if (notifSource) { notifSource.close(); notifSource = null; }
            document.getElementById('user-info').textContent = '';
            document.getElementById('btn-logout').style.display = 'none';
            document.getElementById('btn-config').style.display = 'none';
            document.getElementById('notification-container').style.display = 'none';
            showScreen('login');
        }

        async function logout() {
            await fetch('/auth/logout', { method: 'POST' });
            showLoggedOut();
        }

        // --- Login ---
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('login-error');
            errorDiv.style.display = 'none';
            const resp = await fetch('/auth/login', jsonBody('POST', {
                email: document.getElementById('email-input').value.trim(),
                password: document.getElementById('password-input').value,
            }));
            document.getElementById('password-input').value = '';
            if (!resp.ok) {
                errorDiv.textContent = resp.status === 401 ? 'Wrong email or password' : 'Login failed';
                errorDiv.style.display = 'block';
                return;
            }
            setUser(await resp.json());
        });

        // --- Session list ---
        async function loadSessionList() {
            const resp = await api('/me/sessions');
            if (!resp.ok) return;
            const sessions = await resp.json();

            const container = document.getElementById('session-entries');
            container.innerHTML = '';

            if (!sessions || sessions.length === 0) {
                container.innerHTML = '<p style="color:#666;text-align:center;padding:40px 0;">No sessions yet. Create one!</p>';
                return;
            }

            sessions.forEach(s => {
                const div = document.createElement('div');
                div.className = 'session-entry' + (s.active ? ' active' : '');
                const title = s.title || 'Untitled session';
                const date = new Date(s.created_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                const others = (s.members || []).filter(m => m.user_id !== currentUser.id).map(userName);
                const shared = others.length ? ' · with ' + others.join(', ') : '';
                // The creator deletes the session for everyone; the others leave it.
                const mine = s.created_by === currentUser.id;
                div.innerHTML =
                    '<div><div class="session-title">' + escapeHtml(title) + '</div>' +
                    '<div class="session-meta">' + escapeHtml(date + shared) + '</div></div>' +
                    '<div class="session-right">' +
                        '<button class="session-delete" onclick="' + (mine ? 'deleteSession' : 'leaveSessionFromList') + '(event, \'' + s.session_id + '\')" title="' + (mine ? 'Delete session' : 'Leave session') + '">&times;</button>' +
                        '<div class="status-dot ' + (s.active ? 'active' : 'inactive') + '"></div>' +
                    '</div>';
                div.onclick = () => openSession(s.session_id);
                container.appendChild(div);
            });
        }

        async function deleteSession(e, id) {
            e.stopPropagation();
            if (!confirm('Delete this session and all its data, for every member?')) return;
            await api('/sessions/' + id, { method: 'DELETE' });
            loadSessionList();
        }

        async function leaveSessionFromList(e, id) {
            e.stopPropagation();
            if (!confirm('Leave this session? The other members keep it.')) return;
            await api('/sessions/' + id + '/members/' + currentUser.id, { method: 'DELETE' });
            loadSessionList();
        }

        async function leaveSession() {
            if (!confirm('Leave this session? The other members keep it.')) return;
            await api('/sessions/' + sessionID + '/members/' + currentUser.id, { method: 'DELETE' });
            showSessionList();
        }

        // --- Members ---
        function renderMembers(members) {
            document.getElementById('members-list').innerHTML = 'Members: ' + members.map(m =>
                '<span class="member-chip" title="' + escapeHtml(m.email) + '">' + escapeHtml(userName(m)) + '</span>'
            ).join(' ');
        }

        async function loadMembers() {
            document.getElementById('members-error').textContent = '';
            const resp = await api('/sessions/' + sessionID + '/members');
            if (resp.ok) renderMembers(await resp.json());
        }

        document.getElementById('add-member-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('add-member-input');
            const email = input.value.trim();
            if (!email) return;
            const resp = await api('/sessions/' + sessionID + '/members', jsonBody('POST', { email }));
            const errorSpan = document.getElementById('members-error');
            if (!resp.ok) {
                errorSpan.textContent = resp.status === 404 ? 'No user with this email' : 'Could not add member';
                return;
            }
            errorSpan.textContent = '';
            input.value = '';
            renderMembers(await resp.json());
        });

        function showSessionList() {
            if (evtSource) { evtSource.close(); evtSource = null; }
            sessionID = null;
            showScreen('sessions');
        }

        async function createNewSession() {
            const resp = await api('/sessions', jsonBody('POST', {}));
            const data = await resp.json();
            openSession(data.session_id);
        }

        // openSession shows a session. highlightID scrolls to one of its
        // messages: the one a fork started from, when coming from the fork.
        function openSession(id, highlightID) {
            sessionID = id;
            showScreen('chat');
            connectSSE();
            refreshSession(highlightID);
        }

        // refreshSession redraws the conversation and its place in the fork
        // tree. It runs on open, and whenever messages get their IDs.
        async function refreshSession(highlightID) {
            const id = sessionID;
            await loadHistory();
            if (id !== sessionID) return; // another session was opened meanwhile
            const resp = await api('/sessions/' + sessionID);
            if (!resp.ok) return;
            renderSessionInfo(await resp.json());
            if (highlightID) highlightMessage(highlightID);
        }

        // --- Chat ---
        async function loadHistory() {
            const resp = await api('/sessions/' + sessionID + '/history');
            if (!resp.ok) return;
            const history = await resp.json();

            const chat = document.getElementById('chat');
            chat.innerHTML = '';
            if (!history) return;

            history.forEach(entry => {
                if (entry.type === 'fork_summary') {
                    appendForkSummary(entry.content);
                } else if (entry.type === 'message') {
                    appendMessage(entry.role, entry.content, entry.user_id, entry.author, entry.id);
                } else if (entry.type === 'tool_calls' && entry.tool_calls) {
                    entry.tool_calls.forEach(tc => {
                        appendToolCall(tc.name, tc.input);
                    });
                }
            });
        }

        // --- Forks ---
        function renderSessionInfo(info) {
            const chat = document.getElementById('chat');
            document.getElementById('fork-banner')?.remove();
            if (info.parent) {
                const banner = document.createElement('div');
                banner.id = 'fork-banner';
                banner.className = 'fork-banner';
                if (info.parent.accessible) {
                    banner.innerHTML = '↳ Forked from <a href="#">' + escapeHtml(info.parent.title || 'Untitled session') + '</a>';
                    banner.querySelector('a').onclick = (e) => {
                        e.preventDefault();
                        openSession(info.parent.session_id, info.parent.message_id);
                    };
                } else {
                    banner.textContent = '↳ Forked from a session you do not have access to';
                }
                chat.prepend(banner);
            }

            // Mark the messages forks started from.
            const byMessage = {};
            (info.forks || []).forEach(f => (byMessage[f.forked_at_message_id] ||= []).push(f));
            Object.entries(byMessage).forEach(([msgID, forks]) => {
                const msg = chat.querySelector('[data-id="' + msgID + '"]');
                if (!msg) return;
                const marker = document.createElement('div');
                marker.className = 'fork-marker';
                marker.innerHTML = '⑂ ' + forks.length + ' fork' + (forks.length > 1 ? 's' : '') + ': ' +
                    forks.map((f, i) => '<a href="#" data-fork="' + i + '">' + escapeHtml(f.title || 'Fork') + '</a>').join(', ');
                marker.querySelectorAll('a').forEach(a => a.onclick = (e) => {
                    e.preventDefault();
                    openSession(forks[a.dataset.fork].session_id);
                });
                msg.after(marker);
            });

            setForkPending(info.summary === 'pending');
            if (info.summary === 'failed') setStatus('The summary of the parent session could not be written: this fork starts without it.');
        }

        function setForkPending(pending) {
            const input = document.getElementById('message-input');
            const btn = document.querySelector('#input-form button');
            input.disabled = pending;
            btn.disabled = pending;
            if (pending) setStatus('Summarizing the parent session...');
            else if (document.getElementById('status').textContent.startsWith('Summarizing')) setStatus('');
        }

        function appendForkSummary(content) {
            const chat = document.getElementById('chat');
            const details = document.createElement('details');
            details.className = 'fork-summary';
            details.innerHTML = '<summary>Carried over from the parent session (summary)</summary>' +
                '<div class="fork-summary-body">' + marked.parse(String(content)) + '</div>';
            chat.appendChild(details);
        }

        function highlightMessage(id) {
            const msg = document.querySelector('#chat [data-id="' + id + '"]');
            if (!msg) return;
            msg.scrollIntoView({ block: 'center' });
            msg.classList.add('highlight');
            setTimeout(() => msg.classList.remove('highlight'), 3000);
        }

        async function forkAt(messageID) {
            if (!confirm('Start a new session from this message? It begins with a summary of the conversation up to here.')) return;
            const resp = await api('/sessions/' + sessionID + '/fork', jsonBody('POST', { message_id: messageID }));
            if (!resp.ok) {
                setStatus('Could not fork: ' + (await resp.text()));
                return;
            }
            const data = await resp.json();
            openSession(data.session_id);
        }

        function connectSSE() {
            if (evtSource) { evtSource.close(); }
            document.getElementById('chat').innerHTML = '';
            evtSource = new EventSource('/sessions/' + sessionID + '/stream');

            evtSource.addEventListener('fork_ready', () => refreshSession());
            evtSource.addEventListener('fork_failed', () => refreshSession());

            evtSource.addEventListener('message', (e) => {
                const data = JSON.parse(e.data);
                appendMessage('assistant', data.content);
                setProcessing(false);
                setStatus('');
                // Live messages have no ID yet: reload once stored, so they
                // can be forked from.
                setTimeout(() => refreshSession(), 1500);
            });

            // Another member's message: the sender has shown its own already.
            evtSource.addEventListener('user_message', (e) => {
                const data = JSON.parse(e.data);
                if (data.user_id === currentUser.id) return;
                appendMessage('user', data.content, data.user_id, data.author);
                setProcessing(true);
                setStatus(data.author + ' asked. Thinking...');
            });

            evtSource.addEventListener('tool_calls', (e) => {
                const data = JSON.parse(e.data);
                if (data.tool_calls) {
                    data.tool_calls.forEach(tc => {
                        appendToolCall(tc.name, tc.input);
                    });
                }
                setStatus('Using tools...');
            });

            evtSource.addEventListener('ask_user', (e) => {
                const data = JSON.parse(e.data);
                appendAskUser(data.question, data.workflow_id, data.agent_chain || []);
                setStatus('Waiting for your answer...');
            });

            evtSource.onerror = () => {
                setStatus('Connection lost. Reconnecting...');
                evtSource.close();
                setTimeout(() => { connectSSE(); refreshSession(); }, 3000);
            };
        }

        // appendMessage shows a message. A user message written by another
        // member is labelled with its author.
        function appendMessage(role, content, authorID, authorName, messageID) {
            if (!content) return;
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            const other = role === 'user' && authorID && currentUser && authorID !== currentUser.id;
            div.className = 'message ' + role + (other ? ' other' : '');
            if (messageID) div.dataset.id = messageID;
            if (role === 'assistant') {
                div.innerHTML = marked.parse(String(content));
            } else {
                if (other) {
                    const label = document.createElement('span');
                    label.className = 'author';
                    label.textContent = authorName || 'Another member';
                    div.appendChild(label);
                }
                div.appendChild(document.createTextNode(content));
            }
            if (messageID) {
                const btn = document.createElement('button');
                btn.className = 'fork-btn';
                btn.title = 'Start a new session from this message';
                btn.textContent = '⑂ Fork';
                btn.onclick = () => forkAt(messageID);
                div.appendChild(btn);
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function appendToolCall(name, input) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'tool-call';
            const inputStr = typeof input === 'string' ? input : JSON.stringify(input);
            div.innerHTML = '<span class="tool-name">' + escapeHtml(name) + '</span> ' + escapeHtml(inputStr).slice(0, 200);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function appendAskUser(question, workflowID, agentChain) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'ask-user';
            div.id = 'ask-' + workflowID;

            let chainHtml = '';
            if (agentChain.length > 0) {
                const parts = agentChain.map(a => '<span class="agent-name">' + escapeHtml(a) + '</span>');
                chainHtml = '<div class="agent-chain">' + parts.join('<span class="separator">›</span>') + '</div>';
            }

            div.innerHTML = chainHtml +
                '<div class="question">' + escapeHtml(question) + '</div>' +
                '<form class="ask-user-form" onsubmit="submitAnswer(event, \'' + escapeHtml(workflowID) + '\')">' +
                    '<input type="text" placeholder="Your answer..." autofocus />' +
                    '<button type="submit">Reply</button>' +
                '</form>' +
                '<div class="answered-text" style="display:none"></div>';

            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            div.querySelector('input').focus();
        }

        async function submitAnswer(e, workflowID) {
            e.preventDefault();
            const form = e.target;
            const input = form.querySelector('input');
            const answer = input.value.trim();
            if (!answer) return;

            await api('/sessions/' + sessionID + '/answer', jsonBody('POST', { workflow_id: workflowID, answer }));

            const container = document.getElementById('ask-' + workflowID);
            container.classList.add('answered');
            const answeredText = container.querySelector('.answered-text');
            answeredText.textContent = 'Answered: ' + answer;
            answeredText.style.display = 'block';
            setStatus('Thinking...');
        }

        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        document.getElementById('input-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!sessionID) return;

            if (isProcessing) {
                // Cancel the running agent
                await api('/sessions/' + sessionID + '/cancel', { method: 'POST' });
                setStatus('Cancelling...');
                return;
            }

            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content) return;

            appendMessage('user', content, currentUser.id, userName(currentUser));
            input.value = '';
            input.style.height = 'auto';
            setProcessing(true);
            setStatus('Thinking...');

            await api('/sessions/' + sessionID + '/messages', jsonBody('POST', { content }));
        });

        // Auto-resize textarea
        document.getElementById('message-input').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // --- Notifications ---
        async function connectNotifications() {
            if (!currentUser) return;
            document.getElementById('notification-container').style.display = 'block';

            // Load history
            try {
                const resp = await api('/me/notifications');
                if (resp.ok) {
                    notifications = await resp.json();
                }
            } catch (e) {
                console.error('Failed to load notifications:', e);
            }
            renderNotifications();

            // Live SSE
            if (notifSource) { notifSource.close(); }
            notifSource = new EventSource('/me/notifications/stream');
            notifSource.addEventListener('notification', (e) => {
                // Live notifications don't have an ID yet — reload to get it
                api('/me/notifications')
                    .then(r => r.json())
                    .then(data => { notifications = data; renderNotifications(); });
                unreadCount++;
                updateNotificationBadge();
            });
            notifSource.onerror = () => {
                notifSource.close();
                setTimeout(() => connectNotifications(), 5000);
            };
        }

        function updateNotificationBadge() {
            const badge = document.getElementById('notification-badge');
            if (unreadCount > 0) {
                badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        function toggleNotificationPanel() {
            const panel = document.getElementById('notification-panel');
            const isOpen = panel.style.display !== 'none';
            panel.style.display = isOpen ? 'none' : 'block';
            if (!isOpen) {
                unreadCount = 0;
                updateNotificationBadge();
            }
        }

        function renderNotifications() {
            const list = document.getElementById('notification-list');
            if (!notifications || notifications.length === 0) {
                list.innerHTML = '<div class="notification-empty">No notifications yet.</div>';
                return;
            }
            list.innerHTML = notifications.map(n =>
                '<div class="notification-item">' +
                    '<button class="notification-dismiss" onclick="dismissNotification(event, ' + n.id + ')">&times;</button>' +
                    marked.parse(String(n.content)) +
                '</div>'
            ).join('');
        }

        async function dismissNotification(e, id) {
            e.stopPropagation();
            await api('/me/notifications/' + id, { method: 'DELETE' });
            notifications = notifications.filter(n => n.id !== id);
            renderNotifications();
        }

        async function clearAllNotifications(e) {
            e.stopPropagation();
            await api('/me/notifications', { method: 'DELETE' });
            notifications = [];
            renderNotifications();
        }

        // --- Admin: Activity Queue Routing ---
        async function loadAdminData() {
            const [mappingsResp, queuesResp] = await Promise.all([
                api('/api/admin/activity-queues'),
                api('/api/admin/queues'),
            ]);
            const mappings = await mappingsResp.json();
            const queues = await queuesResp.json();

            // Populate queue dropdown
            const queueSelect = document.getElementById('aq-queue');
            queueSelect.innerHTML = queues.map(q =>
                '<option value="' + escapeHtml(q) + '">' + escapeHtml(q) + '</option>'
            ).join('');

            // Render current mappings
            const list = document.getElementById('aq-list');
            if (!mappings || mappings.length === 0) {
                list.innerHTML = '<p style="color:#666;text-align:center;padding:20px 0;">No activity queue mappings configured. All activities run on the workflow\'s task queue.</p>';
                return;
            }
            list.innerHTML = mappings.map(m =>
                '<div style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">' +
                    '<div><span style="color:#f59e0b;font-weight:600;">' + escapeHtml(m.activity_name) + '</span>' +
                    ' <span style="color:#666;margin:0 8px;">→</span> ' +
                    '<span style="color:#22c55e;">' + escapeHtml(m.task_queue) + '</span></div>' +
                    '<button onclick="deleteActivityQueue(\'' + escapeHtml(m.activity_name) + '\')" style="background:none;border:none;color:#666;font-size:16px;cursor:pointer;padding:2px 6px;border-radius:4px;line-height:1;" title="Remove mapping">&times;</button>' +
                '</div>'
            ).join('');
        }

        document.getElementById('aq-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const activityName = document.getElementById('aq-activity').value;
            const taskQueue = document.getElementById('aq-queue').value;
            if (!activityName || !taskQueue) return;

            await api('/api/admin/activity-queues', jsonBody('PUT', { activity_name: activityName, task_queue: taskQueue }));
            loadAdminData();
        });

        async function deleteActivityQueue(activityName) {
            await api('/api/admin/activity-queues/' + encodeURIComponent(activityName), { method: 'DELETE' });
            loadAdminData();
        }

        // Close notification panel on outside click
        document.addEventListener('click', (e) => {
            const container = document.getElementById('notification-container');
            if (container && !container.contains(e.target)) {
                document.getElementById('notification-panel').style.display = 'none';
            }
        });

        init();
    </script>
</body>
</html>
