<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporal Agent</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <script src="https://unpkg.com/marked@15.0.4/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 12px 20px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 16px; font-weight: 600; color: #fff; }
        #session-info { font-size: 12px; color: #666; }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            line-height: 1.6;
        }
        .message.user {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 12px 16px;
            align-self: flex-end;
        }
        .message.assistant {
            padding: 4px 0;
        }
        .message.assistant pre {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .message.assistant code {
            font-size: 13px;
            background: #2a2a2a;
            padding: 2px 5px;
            border-radius: 3px;
        }
        .message.assistant ul, .message.assistant ol {
            margin: 8px 0;
            padding-left: 24px;
        }
        .message.assistant li { margin: 4px 0; }
        .message.assistant h1, .message.assistant h2, .message.assistant h3 {
            margin: 12px 0 6px;
            color: #fff;
        }
        .message.assistant p { margin: 6px 0; }
        .message.assistant strong { color: #fff; }
        .message.assistant a { color: #3b82f6; text-decoration: none; }
        .message.assistant a:hover { text-decoration: underline; }
        .tool-call {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            background: #1a1a1a;
            border-left: 3px solid #f59e0b;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 13px;
            color: #999;
        }
        .tool-call .tool-name { color: #f59e0b; font-weight: 600; }

        .ask-user {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            background: #1a1a2e;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 12px 16px;
        }
        .ask-user .agent-chain {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #666;
            margin-bottom: 8px;
        }
        .ask-user .agent-chain .agent-name {
            background: #2a2a3e;
            border-radius: 4px;
            padding: 2px 6px;
            color: #8b8baf;
        }
        .ask-user .agent-chain .separator {
            color: #444;
        }
        .ask-user .question {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 10px;
        }
        .ask-user-form {
            display: flex;
            gap: 8px;
        }
        .ask-user-form input {
            flex: 1;
            background: #0f0f1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #e0e0e0;
            padding: 8px 12px;
            font-size: 13px;
            font-family: inherit;
        }
        .ask-user-form input:focus { outline: none; border-color: #3b82f6; }
        .ask-user-form button {
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .ask-user-form button:hover { background: #2563eb; }
        .ask-user.answered { opacity: 0.5; border-color: #333; }
        .ask-user.answered .ask-user-form { display: none; }
        .ask-user .answered-text {
            font-size: 12px;
            color: #666;
            font-style: italic;
        }

        #input-area {
            border-top: 1px solid #2a2a2a;
            padding: 16px 20px;
        }
        #input-form {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            gap: 8px;
        }
        #input-form textarea {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            rows: 1;
            min-height: 42px;
            max-height: 120px;
        }
        #input-form textarea:focus { outline: none; border-color: #555; }
        #input-form button {
            background: #e0e0e0;
            color: #0f0f0f;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        #input-form button:hover { background: #fff; }
        #input-form button:disabled { opacity: 0.4; cursor: not-allowed; }

        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline; }

        #status {
            text-align: center;
            padding: 4px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <h1>Temporal Agent</h1>
        <span id="session-info">Connecting...</span>
    </header>

    <div id="chat"></div>
    <div id="status"></div>

    <div id="input-area">
        <form id="input-form">
            <textarea id="message-input" placeholder="Send a message..." rows="1"
                      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit()}"></textarea>
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        let sessionID = null;
        let evtSource = null;

        async function initSession() {
            const resp = await fetch('/sessions', { method: 'POST' });
            const data = await resp.json();
            sessionID = data.session_id;
            document.getElementById('session-info').textContent = 'Session: ' + sessionID.slice(0, 8) + '...';
            connectSSE();
        }

        function connectSSE() {
            if (evtSource) {
                evtSource.close();
            }
            evtSource = new EventSource('/sessions/' + sessionID + '/stream');

            evtSource.addEventListener('message', (e) => {
                const data = JSON.parse(e.data);
                appendMessage('assistant', data.content);
                setStatus('');
            });

            evtSource.addEventListener('tool_calls', (e) => {
                const data = JSON.parse(e.data);
                if (data.tool_calls) {
                    data.tool_calls.forEach(tc => {
                        appendToolCall(tc.name, tc.input);
                    });
                }
                setStatus('Using tools...');
            });

            evtSource.addEventListener('ask_user', (e) => {
                const data = JSON.parse(e.data);
                appendAskUser(data.question, data.workflow_id, data.agent_chain || []);
                setStatus('Waiting for your answer...');
            });

            evtSource.onerror = () => {
                setStatus('Connection lost. Reconnecting...');
            };
        }

        function appendMessage(role, content) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'message ' + role;
            if (role === 'assistant') {
                div.innerHTML = marked.parse(content);
            } else {
                div.textContent = content;
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function appendToolCall(name, input) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'tool-call';
            const inputStr = typeof input === 'string' ? input : JSON.stringify(input);
            div.innerHTML = '<span class="tool-name">' + escapeHtml(name) + '</span> ' + escapeHtml(inputStr).slice(0, 200);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function appendAskUser(question, workflowID, agentChain) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'ask-user';
            div.id = 'ask-' + workflowID;

            let chainHtml = '';
            if (agentChain.length > 0) {
                const parts = agentChain.map(a => '<span class="agent-name">' + escapeHtml(a) + '</span>');
                chainHtml = '<div class="agent-chain">' + parts.join('<span class="separator">›</span>') + '</div>';
            }

            div.innerHTML = chainHtml +
                '<div class="question">' + escapeHtml(question) + '</div>' +
                '<form class="ask-user-form" onsubmit="submitAnswer(event, \'' + escapeHtml(workflowID) + '\')">' +
                    '<input type="text" placeholder="Your answer..." autofocus />' +
                    '<button type="submit">Reply</button>' +
                '</form>' +
                '<div class="answered-text" style="display:none"></div>';

            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            div.querySelector('input').focus();
        }

        async function submitAnswer(e, workflowID) {
            e.preventDefault();
            const form = e.target;
            const input = form.querySelector('input');
            const answer = input.value.trim();
            if (!answer) return;

            await fetch('/sessions/' + sessionID + '/answer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ workflow_id: workflowID, answer }),
            });

            const container = document.getElementById('ask-' + workflowID);
            container.classList.add('answered');
            const answeredText = container.querySelector('.answered-text');
            answeredText.textContent = 'Answered: ' + answer;
            answeredText.style.display = 'block';
            setStatus('Thinking...');
        }

        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        document.getElementById('input-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content || !sessionID) return;

            appendMessage('user', content);
            input.value = '';
            setStatus('Thinking...');

            await fetch('/sessions/' + sessionID + '/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content }),
            });
        });

        // Auto-resize textarea
        document.getElementById('message-input').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        initSession();
    </script>
</body>
</html>
