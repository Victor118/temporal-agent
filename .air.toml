root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/main"
  full_bin = "./tmp/main dev"
  cmd = "go build -buildvcs=false -o ./tmp/main ./cmd/agent"
  delay = 1000
  exclude_dir = ["tmp", "vendor"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "yaml", "yml"]
  kill_delay = "0s"
  send_interrupt = false
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
