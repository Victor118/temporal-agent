# Worker config for the read-only Claude Code container (WORKER_CONFIG).
#
# Same image as the write worker, one difference: no credential is mounted
# here. An analysis therefore runs on a machine where nothing can be pushed,
# which makes "read-only" a property of the environment and not only of the
# workflow's permission mode.
queue: tools-claude-code-ro

# This worker does not serve sessions, agents or LLM calls: it polls its own
# queue and nothing else.
workflows: false

tools:
  - analyze_repo
