# Worker config for the read-only Claude Code container (WORKER_CONFIG).
#
# Same image as the write worker, one difference: the git identity mounted
# here can read and nothing else. A private repository still needs one to be
# cloned at all, so the guarantee is not "this container holds no secret" —
# it is that the secret it holds cannot write anywhere. A run that reads the
# key gains what it already had.
queue: tools-claude-code-ro

# This worker does not serve sessions, agents or LLM calls: it polls its own
# queue and nothing else.
workflows: false

# It publishes no tool: analyze_repo is the main worker's (CodingRunWorkflow),
# which runs it on the user's machine, or here, as its fallback queue
# (CLAUDE_CODE_ANALYZE_QUEUE, this queue by default): this worker serves
# AnalyzeRepoWorkflow on it. At startup it withdraws the row it published
# before.
tools: []
