# Worker config for the writing Claude Code container (WORKER_CONFIG).
#
# This is the worker that mounts a push credential (CLAUDE_CODE_SSH_KEY). A run
# here can reach that key by executing commands, so what bounds the damage is
# the key's own scope — a deploy key for the repositories these runs are meant
# to touch, never a personal identity.
queue: tools-claude-code

workflows: false

tools:
  - implement_feature
