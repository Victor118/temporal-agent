# Seed only: imported at startup into an EMPTY agents table. Once the table
# holds anything, edit agents in the back-office (/admin); this file is ignored.
#
# tools is an allowlist of tool name globs, denied by default: an agent without
# it gets no tool at all. "*" grants every tool and must be written explicitly.
# Each agent is also a tool, agent_<id>, to delegate to it: "agent_*" allows
# delegating to every other agent.
agents:
  - id: default
    name: Default Agent
    # mention: jarvis   # what members write to call it (@jarvis); default = the id
    description: General-purpose assistant for everyday tasks.
    skills: []
    tools:
      - read_file
      - list_directory
      - glob
      - grep
      - web_search
      - web_fetch
      - ask_user
      - save_user_memory
      - schedule_task
      - list_schedules
      - cancel_schedule
      - agent_*
      - analyze_repo

  - id: market-analyst
    name: Market Analyst
    description: Analyzes financial markets, performs trading research, summarizes market trends.
    skills:
      - market-research
    tools:
      - web_search
      - web_fetch
      - ask_user
      - save_user_memory

  - id: code-reviewer
    name: Code Reviewer
    description: Reviews code changes, suggests improvements, checks for bugs and code quality.
    skills:
      - code-review
    tools:
      - read_file
      - list_directory
      - glob
      - grep
      - analyze_repo
      - ask_user
