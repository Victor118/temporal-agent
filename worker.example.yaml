# Worker config (WORKER_CONFIG, default ./worker.yaml).
# A queue is a capability: every worker serving the same queue must expose the
# same tools, and a given tool must be served by a single queue.
# Without this file, the worker serves workflows and all tools on the workflow
# queue (WORKFLOW_QUEUE, default "agent") and loads every MCP_SERVERS entry.

queue: tools-core

# Also serve the workflow queue: sessions, agents and LLM calls.
workflows: true

# Tool name globs exposed on this queue ("*" = every registered tool).
tools:
  - memory_*
  - web_*
  - github_*

# MCP servers loaded by this worker; their tools are named "<name>_<tool>" and
# filtered by the globs above. A server down at startup is retried in the
# background (5 s doubling to 5 min); every server is discovered again every
# 30 s, so tools it adds or removes are registered or withdrawn. A tool name
# already taken (a built-in tool, an earlier server) is refused and logged.
mcp:
  - name: github
    url: http://mcp-github:3001
    api_key: ""         # sent as "Authorization: Bearer <api_key>"
    # http (default): Streamable HTTP, MCP 2025-03-26 and later.
    # sse: the deprecated HTTP+SSE transport (MCP 2024-11-05), url = the SSE endpoint.
    transport: http
